<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SérieScope</title>

    <!-- file css  -->

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="text-[white] bg-[#111010] ">
    <header class="flex items-center justify-between pt-5 pb-5 px-[5%] bg-[#080808]"> 
        <div class="flex gap-5 items-center">
            <span class="bg-[white] px-2 py-1 rounded-lg"><i class="fa-solid fa-film" style="color: rgb(0, 0, 0);"></i></span>
            <p class="text-2xl">SérieScope</p>
        </div>
    </header>
    <main class="px-[5%] py-[3%]">
        <section>
                <div class="mb-5">
                    <h1 class="text-[25px] font-bold">Explore les séries TV</h1>
                    <p class="text-[12px] text-[#8290A2]">Retrouve tes séries préférées et enrichis le catalogue.</p>
                </div>
                <form class="bg-[#191919] p-5 border border-[#393939] rounded-lg leading-7" >
                    <div class="mb-3" >
                        <h3 id="form_title" class="text-[20px] font-medium">Ajouter une série</h3>
                        <p class="text-[#8290A2] text-[10px]">Les champs marqués d’un * sont obligatoires.</p>
                    </div>
                    <div class="text-[11px] gap-3 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3">
                        <div class="flex flex-col xl:col-span-1">
                            <label class="mb-1">Nom de la série *</label>
                            <input type="text"  id="seriesName" class="border border-[#393939] bg-[#191919] rounded-md px-1 py-2" placeholder="Ex. The Bear" required>
                        </div>
                        <div class="flex flex-col xl:col-span-1">
                            <label class="mb-1">Genre(s) *</label>
                            <input type="text"  id="genre" class="border border-[#393939] bg-[#191919] rounded-md px-1 py-2" placeholder="Ex. Drame, Comédie" required>
                        </div>
                        <div class="flex flex-col xl:col-span-1">
                            <label for="seriesImage" class="mb-1">image *</label>
                            <input type="file" id="seriesImage" name="seriesImage" accept="image/*"
                                aria-describedby="seriesImageError"
                                class="border border-[#393939] bg-[#191919] rounded-md px-2 py-2 text-[14px] font-normal
                                    file:mr-3 file:rounded-md file:border-0 file:bg-white file:px-3 file:py-1 file:text-black
                                    focus:outline-none focus:ring-2 focus:ring-white">
                            <p id="seriesImageError" class="text-red-400 text-[12px] font-normal min-h-[18px]" role="alert"></p>
                        </div>
                        <div class="flex flex-col xl:col-span-4">
                            <label  class="mb-1 text-[11px]"  for="description">
                                Description *
                            </label>
                            <textarea class="border border-[#393939] bg-[#191919] rounded-md px-2 py-2 " id="description" name="description"  placeholder="Résume la série en quelques mots…"
                                required></textarea>
                        </div>
                    </div>
                    <div class=" flex justify-start">
                        <button id="submit" class= "bg-[white] text-[11px]  text-black p-2 mt-3 rounded-lg ">
                            ＋ Ajouter la série
                        </button>
                    </div>
                </form>
            </section>
            <section aria-labelledby="catalogue_title" class="mt-10">
                <div class="mb-3">
                    <h2 id="catalogue_title" class="text-[20px] font-bold">Catalogue des séries</h2>
                    <p class="text-[#8290A2] text-[12px]">Recherche par nom ou explore un genre.</p>
                </div>
    
                <div class="bg-[#191919] border border-[#393939] rounded-lg p-4 grid grid-cols-1 md:grid-cols-[1fr_1fr_auto] gap-3 items-end">
                    <div class="flex flex-col">
                        <label for="searchInput" class="mb-1 text-[14px] font-bold">Rechercher une série</label>
                        <input type="search" id="searchInput" placeholder="Ex. Breaking Bad"
                            class="border border-[#393939] bg-[#191919] rounded-md px-2 py-2 text-[15px] focus:outline-none focus:ring-2 focus:ring-white">
                    </div>
    
                    <div class="flex flex-col">
                        <label for="genreFilter" class="mb-1 text-[14px] font-bold">Genre</label>
                        <select id="genreFilter"
                            class="border border-[#393939] bg-[#191919] rounded-md px-2 py-2 text-[15px] focus:outline-none focus:ring-2 focus:ring-white">
                            <option value="all">Tous les genres</option>
                        </select>
                    </div>
    
                    <button type="button" id="resetBtn"
                        class="border border-[#393939] bg-[#191919] rounded-md px-4 py-2 text-[15px] font-bold hover:bg-[#252525] focus:outline-none focus:ring-2 focus:ring-white">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Réinitialiser
                    </button>
                </div>
    
                <p id="resultCount" class="text-[#8290A2] text-[12px] mt-4 mb-3" aria-live="polite"></p>
                <p id="errorMessage" class="text-red-400 text-[15px] hidden" role="alert"></p>
                <p id="emptyMessage" class="text-[#8290A2] text-[15px] hidden">Aucune série trouvée.</p>
    
                <div id="articles" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">

                </div>
        </section>
    </main>







    <script src="script.js"></script>

   
</body>
</html>
